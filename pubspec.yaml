name: smarty_entregas
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.0
  shimmer: ^3.0.0

  http: ^1.2.2
  connectivity_plus: ^6.1.4
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  mask_text_input_formatter: ^2.8.0
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  mapbox_maps_flutter: ^2.5.0
  geolocator: ^14.0.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.5
  flutter_local_notifications: ^18.0.1
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
  - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/foreground-logo.png"
  adaptive_icon_background: "assets/background-logo.png"
  adaptive_icon_foreground: "assets/foreground-logo.png"

flutter_native_splash:
  color: "#FFA726"
  image: assets/logo.png
  android: true
  ios: false
